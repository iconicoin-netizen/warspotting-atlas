name: Update context overlays

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warspotting-overlay-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'iconicoin-netizen/warspotting-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test overlay parsers
        run: python scripts/update-overlays.test.py
      - name: Fetch and validate context overlays
        run: python scripts/update-overlays.py
      - name: Commit the validated overlays
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/overlays
          if git diff --cached --quiet; then
            echo 'No overlay changes.'
            exit 0
          fi
          git commit -m "Update context overlays ($(date -u +%F))"
          git push origin HEAD:main
      - name: Write run summary
        run: |
          echo '## Context overlay update' >> "$GITHUB_STEP_SUMMARY"
          echo 'The UAControlMap contact lines were refreshed.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/overlays/overlay-meta.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
